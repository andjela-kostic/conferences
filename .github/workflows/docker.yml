name: Docker image

# Builds the API image and pushes it to GitHub Container Registry
# (ghcr.io/<owner>/conferences-api) after a merge to main, but only once the
# CI workflow (format, build, tests) has succeeded for that commit.
# Pull requests never build or push images.
#
# Note: workflow_run triggers only work from the workflow file on the default
# branch, so this starts running after it has been merged to main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the built-in GITHUB_TOKEN, no extra secret

    steps:
      # Build exactly the commit CI tested, not whatever main points to now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/conferences-api
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: API/Dockerfile
          platforms: linux/amd64   # Azure Container Apps runs amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

