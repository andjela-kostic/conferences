# PostgreSQL + API. This file is what Azure Container Apps uses:
#   az containerapp compose create --compose-file-path docker-compose.yml ...
# Locally, docker-compose.override.yml is merged in automatically (host port for the
# database, building the API image from source):
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up -d --build --wait
# Data survives restarts in the "postgres-data" volume; `docker compose down -v` wipes it.

name: conferences

services:
  db:
    # Same major version as the integration tests (tests/API.IntegrationTests/ApiFactory.cs).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ConferencesDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}
    # Reachable by the API only; no public port.
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    # Published to GitHub Container Registry by .github/workflows/docker.yml after every merge to main.
    image: ${API_IMAGE:-ghcr.io/andjela-kostic/conferences-api:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Gss Encryption Mode=Disable: the runtime image has no Kerberos library, so skip the GSS probe.
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-ConferencesDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set};Gss Encryption Mode=Disable"
      # Apply EF Core migrations when the container starts.
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres-data:
